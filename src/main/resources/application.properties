# Jev (TypeSafe System One) HTTP API
quarkus.rest-client.jev.url=https://api.typesafe.ai
quarkus.rest-client.jev.connect-timeout=5000
quarkus.rest-client.jev.read-timeout=30000

# Read from the TYPESAFE_API_KEY environment variable (or .env in dev mode)
jev.api-key=${TYPESAFE_API_KEY:}
jev.model=jev-latest
jev.max-retries=3

# Illustrative thresholds: evaluate them on your own data before relying on them.
triage.escalate-noul-threshold=0.8
triage.escalate-frustration-score=1.5
triage.min-route-confidence=0.6

quarkus.http.port=8080
